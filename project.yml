name: ExpenseTracker
options:
  bundleIdPrefix: com.rishavjha.larpios
  deploymentTarget:
    iOS: "17.0"

targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - path: ExpenseTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishavjha.larpios.expensetracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: ExpenseTracker/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  ExpenseTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExpenseTrackerTests
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ExpenseTracker:
    build:
      targets:
        ExpenseTracker: all
        ExpenseTrackerTests: [test]
    test:
      targets:
        - ExpenseTrackerTests
